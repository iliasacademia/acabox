# `acabox-share` — the public side. Every route requires a valid Cloudflare
# Access JWT unless ACCESS_DISABLED=true (local dev only — see the README).
# Serves the same R2 bucket the api Worker writes to, read-only, plus the
# static viewer assets under ./public (built by `npm run build:viewer`).

name = "acabox-share"
main = "src/index.ts"

# Keep in sync with api/wrangler.toml — see the comment there.
compatibility_date = "2026-08-25"

# The viewer hostname — this is the one the Cloudflare Access application
# protects, and the only one a human ever opens.
[[routes]]
pattern = "share.acabox.us"
custom_domain = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "acabox-share"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# The Cloudflare Access application "Acabox Share" on share.acabox.us.
# ACCESS_AUD is that application's Application Audience tag; the Worker
# requires it as the `aud` claim, so a JWT minted for any OTHER application
# on this same team domain (paper-monitor, reader, …) is rejected here.
# Both are public identifiers, not secrets — the aud is a claim inside every
# token Access issues. Re-read them with:
#   curl -H "Authorization: Bearer $CF_TOKEN" \
#     https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps
[vars]
ACCESS_TEAM_DOMAIN = "proud-butterfly-1eb0.cloudflareaccess.com"
ACCESS_AUD = "97abc425842008224961c8264c1bf786c079a50b81958bc15712423e4fe80a7f"
